<main class="password-reset-page">
  <section class="password-reset-card">
    <a class="password-reset-domain" href="https://www.ak-coding.de">www.ak-coding.de</a>
    <div class="password-reset-brand">
      <span class="password-reset-logo">&lt;AK&gt;</span>
      <h1>{{ translate.t().auth.resetPassword }}</h1>
    </div>

    <form class="password-reset-form"
      (submit)="$event.preventDefault(); resetPassword(password.value, passwordConfirm.value)">
      <input #password type="password" name="password" [placeholder]="translate.t().auth.newPassword"
        autocomplete="new-password" required />
      <input #passwordConfirm type="password" name="passwordConfirm"
        [placeholder]="translate.t().auth.passwordConfirm" autocomplete="new-password" required />
      <button type="submit" [disabled]="isSubmitting">
        {{ translate.t().auth.resetPassword }}
      </button>
    </form>
  </section>
</main>
