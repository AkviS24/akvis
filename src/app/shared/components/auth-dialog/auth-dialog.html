@if (authDialog.isOpen()) {
<div class="auth-overlay" [class.closing]="authDialog.isClosing()" (click)="authDialog.close()">
  <section class="auth-dialog" [class.closing]="authDialog.isClosing()" role="dialog" aria-modal="true"
    [attr.aria-label]="translate.t().auth.login" (click)="$event.stopPropagation()">
    <a class="auth-domain" href="https://www.ak-coding.de">
      www.ak-coding.de
    </a>

    <div class="auth-header">
      <div class="auth-brand">
        <span class="auth-logo">&lt;AK&gt;</span>
        <h2>
          {{ authDialog.mode() === 'login'
          ? translate.t().auth.login
          : translate.t().auth.register }}
        </h2>
      </div>

      <div class="auth-language">
        <button type="button" class="lang-button" [class.active]="translate.lang() === 'de'"
          (click)="translate.setLang('de')">
          DE
        </button>
        |
        <button type="button" class="lang-button" [class.active]="translate.lang() === 'en'"
          (click)="translate.setLang('en')">
          EN
        </button>
      </div>
    </div>

    @if (authDialog.mode() === 'login') {
    <form class="auth-form" (submit)="$event.preventDefault(); login(email.value, password.value)">
      <input #email type="email" name="email" [placeholder]="translate.t().auth.email" autocomplete="email" required />

      <input #password type="password" name="password" [placeholder]="translate.t().auth.password"
        autocomplete="current-password" required />

      <button type="submit" class="auth-submit" [disabled]="isSubmitting">
        {{ translate.t().auth.submit }}
      </button>
    </form>

    <p class="auth-switch">
      {{ translate.t().auth.noAccount }}
      <button type="button" (click)="authDialog.openRegister()">
        {{ translate.t().auth.register }}
      </button>
    </p>
    } @else {
    <form class="auth-form"
      (submit)="$event.preventDefault(); register(email.value, username.value, password.value, passwordConfirm.value)">
      <input #email type="email" name="email" [placeholder]="translate.t().auth.email" autocomplete="email" required />

      <input #username type="text" name="username" [placeholder]="translate.t().auth.username" autocomplete="username"
        required />

      <input #password type="password" name="password" [placeholder]="translate.t().auth.password"
        autocomplete="new-password" required />

      <input #passwordConfirm type="password" name="passwordConfirm" [placeholder]="translate.t().auth.passwordConfirm"
        autocomplete="new-password" required />

      <button type="submit" class="auth-submit" [disabled]="isSubmitting">
        {{ translate.t().auth.submit }}
      </button>
    </form>

    <p class="auth-switch">
      {{ translate.t().auth.hasAccount }}
      <button type="button" (click)="authDialog.showLogin()">
        {{ translate.t().auth.backToLogin }}
      </button>
    </p>
    }
  </section>
</div>
}
