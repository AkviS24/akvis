<section class="skills-style">
    <article class="skills-headline">
        <h2>{{ translate.t().skills.headline }}</h2>
    </article>
    <section class="skill-icon-container">
        <div class="skillSet-1">
            <img src="img/Icons Skills.png" alt="Angular Icon">
            <img src="img/Icons Skills (10).png" alt="TypeScript Icon">
            <img src="img/Icons Skills (1).png" alt="Typescript Icon">
            <img src="img/Icons Skills (2).png" alt="HTML5 Icon">
            <img src="img/Icons Skills (3).png" alt="CSS Icon">
            <img src="img/Icons Skills (4).png" alt="Rest API Icon">
        </div>
        <div class="skillSet-2">
            <img src="img/Icons Skills (6).png" alt="Supabase Icon">
            <img src="img/Icons Skills (5).png" alt="GitHub Icon">
            <img src="img/Icons Skills (7).png" alt="Scrumm Icon">
            <img src="img/Icons Skills (8).png" alt="MATERIAL DESIGN Icon">
            <img src="img/Icons Skills (9).png" alt="Challenge Icon">
        </div>
    </section>
    <section class="skills-cta">
        <img class="skills-cta-arrow" src="img/arrow_lets_talk.svg" alt="Arrow">
        <p>{{ translate.t().skills.ctaText }}</p>
        <a class="lets-talk-btn" [routerLink]="['']" fragment="contact-component-anchor"
            (click)="scrollToElement('contact-component-anchor', $event)">{{ translate.t().skills.letsTalk }}</a>
    </section>
</section>
