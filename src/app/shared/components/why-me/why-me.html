<section class="why-me-style">
    <article class="profile-image">
        <img class="why-me-profileImage" src="img/Pic 2.png" alt="why-me Image">
    </article>
    <section class="why-me-text">
        <h2>{{ translate.t().whyMe.headline }}</h2>
        <p class="about-me-text">{{ translate.t().whyMe.about }}</p>
        <section class="icon-container">
            <article class="icon-row first-icon-row">
                <h3>{{ translate.t().whyMe.iAm }}</h3>
                <div class="icon">
                    <div class="location-icon-wrapper">
                        <img src="img/Vector (1).png" alt="Location pin">
                    </div>
                    <p>{{ translate.t().whyMe.located }}</p>
                </div>
            </article>
            <article class="icon-row second-icon-row">
                <img class="arrow-relocate" src="img/Arrow 5.png" alt="Arrow">
                <div class="second-icon">
                    <img src="img/Group 24.png" alt="Suitcase">
                    <p>{{ translate.t().whyMe.relocateLine1 }} <br>{{ translate.t().whyMe.relocateLine2 }}</p>
                </div>
            </article>
            <article class="icon-row third-icon-row">
                <div class="third-icon">
                    <img class="remote-icon" src="img/icon_remote.png" alt="Remote work">
                    <p>{{ translate.t().whyMe.remote }}</p>
                    <img class="arrow-remote" src="img/arrow_remote.svg" alt="Arrow">
                </div>
                <img class="arrow-lets-talk" src="img/arrow_lets_talk.svg" alt="Arrow">
            </article>
        </section>
    </section>
    <a class="lets-talk-btn" [routerLink]="['']" fragment="contact-component-anchor"
        (click)="scrollToElement('contact-component-anchor', $event)">{{ translate.t().whyMe.letsTalk }}</a>
</section>
